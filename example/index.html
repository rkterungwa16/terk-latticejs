<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MV Framework — Task Manager Example</title>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --bg: #f6f6f5;
                --surface: #ffffff;
                --surface-2: #f0f0ef;
                --border: rgba(0, 0, 0, 0.09);
                --border-strong: rgba(0, 0, 0, 0.18);
                --focus: #5b4af7;
                --text-1: #141413;
                --text-2: #6a6a68;
                --text-3: #a8a8a5;
                --accent: #5b4af7;
                --accent-bg: #eeecfe;
                --danger: #d93025;
                --danger-bg: #fde8e7;
                --success: #1a7f4b;
                --success-bg: #e6f4ed;
                --radius: 10px;
                --radius-sm: 6px;
                --mono: "Fira Code", "Cascadia Code", Consolas, monospace;
                --shadow:
                    0 1px 3px rgba(0, 0, 0, 0.07), 0 1px 2px rgba(0, 0, 0, 0.04);
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #111110;
                    --surface: #1b1b19;
                    --surface-2: #242422;
                    --border: rgba(255, 255, 255, 0.08);
                    --border-strong: rgba(255, 255, 255, 0.16);
                    --text-1: #e8e8e4;
                    --text-2: #9a9a96;
                    --text-3: #5a5a56;
                    --accent-bg: #1e1a4a;
                    --danger-bg: #1f0a09;
                    --success-bg: #071f10;
                }
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: var(--bg);
                color: var(--text-1);
                min-height: 100vh;
                padding: 2rem 1rem 4rem;
                line-height: 1.55;
            }

            .layout {
                max-width: 820px;
                margin: 0 auto;
                display: grid;
                grid-template-columns: 1fr 280px;
                grid-template-rows: auto 1fr;
                gap: 1.25rem;
            }

            @media (max-width: 640px) {
                .layout {
                    grid-template-columns: 1fr;
                }
            }

            /* ── Header ── */
            .header {
                grid-column: 1 / -1;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .header h1 {
                font-size: 1.2rem;
                font-weight: 650;
                letter-spacing: -0.02em;
            }
            .header p {
                font-size: 0.82rem;
                color: var(--text-2);
            }
            .arch-pill {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                font-size: 0.72rem;
                font-weight: 600;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--accent);
                background: var(--accent-bg);
                border-radius: 99px;
                padding: 3px 10px;
                margin-bottom: 6px;
                width: fit-content;
            }

            /* ── Card shell ── */
            .card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                box-shadow: var(--shadow);
                padding: 1.125rem 1.25rem;
            }
            .card-title {
                font-size: 0.68rem;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--text-3);
                margin-bottom: 1rem;
            }

            /* ── Form inputs ── */
            input[type="text"],
            select {
                width: 100%;
                padding: 0.45rem 0.75rem;
                font-size: 0.875rem;
                font-family: inherit;
                color: var(--text-1);
                background: var(--bg);
                border: 1px solid var(--border-strong);
                border-radius: var(--radius-sm);
                outline: none;
                transition:
                    border-color 0.15s,
                    box-shadow 0.15s;
            }
            input[type="text"]:focus,
            select:focus {
                border-color: var(--focus);
                box-shadow: 0 0 0 3px
                    color-mix(in srgb, var(--focus) 15%, transparent);
            }

            /* ── Buttons ── */
            .btn {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 0.42rem 0.9rem;
                font-size: 0.85rem;
                font-family: inherit;
                font-weight: 500;
                border-radius: var(--radius-sm);
                border: 1px solid var(--border-strong);
                background: var(--surface);
                color: var(--text-1);
                cursor: pointer;
                transition:
                    background 0.12s,
                    transform 0.08s;
            }
            .btn:hover {
                background: var(--surface-2);
            }
            .btn:active {
                transform: scale(0.97);
            }
            .btn-primary {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff;
            }
            .btn-primary:hover {
                background: color-mix(in srgb, var(--accent) 85%, #000);
            }
            .btn-danger {
                color: var(--danger);
                border-color: var(--danger);
            }
            .btn-danger:hover {
                background: var(--danger-bg);
            }
            .btn-icon {
                width: 28px;
                height: 28px;
                padding: 0;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border-radius: var(--radius-sm);
            }

            /* ── Add-task form ── */
            .add-form {
                display: flex;
                flex-direction: column;
                gap: 0.65rem;
            }
            .add-form .row {
                display: flex;
                gap: 0.5rem;
            }
            .add-form .row input {
                flex: 1;
            }

            /* ── Stats sidebar ── */
            .stats {
                display: flex;
                flex-direction: column;
                gap: 0.65rem;
            }
            .stat-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 0.85rem;
            }
            .stat-label {
                color: var(--text-2);
            }
            .stat-value {
                font-weight: 600;
                font-variant-numeric: tabular-nums;
            }
            .stat-value.accent {
                color: var(--accent);
            }
            .stat-value.success {
                color: var(--success);
            }
            .stat-value.danger {
                color: var(--danger);
            }

            .progress-bar {
                width: 100%;
                height: 5px;
                background: var(--surface-2);
                border-radius: 99px;
                overflow: hidden;
                margin-top: 0.25rem;
            }
            .progress-fill {
                height: 100%;
                background: var(--accent);
                border-radius: 99px;
                transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .divider {
                height: 1px;
                background: var(--border);
                margin: 0.25rem 0;
            }

            /* ── Filter bar ── */
            .filter-bar {
                display: flex;
                gap: 0.4rem;
                flex-wrap: wrap;
                margin-bottom: 0.85rem;
            }
            .filter-btn {
                font-size: 0.78rem;
                font-weight: 500;
                padding: 0.25rem 0.7rem;
                border-radius: 99px;
                border: 1px solid var(--border-strong);
                background: transparent;
                color: var(--text-2);
                cursor: pointer;
                transition:
                    background 0.12s,
                    color 0.12s,
                    border-color 0.12s;
            }
            .filter-btn:hover {
                background: var(--surface-2);
                color: var(--text-1);
            }
            .filter-btn.active {
                background: var(--accent-bg);
                color: var(--accent);
                border-color: var(--accent);
            }

            /* ── Task list ── */
            #task-list {
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
                min-height: 60px;
            }

            .task-item {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                padding: 0.65rem 0.85rem;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                box-shadow: var(--shadow);
                transition:
                    opacity 0.2s,
                    border-color 0.2s;
                animation: slide-in 0.18s ease-out;
            }
            @keyframes slide-in {
                from {
                    opacity: 0;
                    transform: translateY(-6px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .task-item.done {
                opacity: 0.55;
            }

            .task-check {
                width: 17px;
                height: 17px;
                border: 1.5px solid var(--border-strong);
                border-radius: 4px;
                flex-shrink: 0;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition:
                    background 0.12s,
                    border-color 0.12s;
            }
            .task-item.done .task-check {
                background: var(--success);
                border-color: var(--success);
            }
            .task-check svg {
                display: none;
            }
            .task-item.done .task-check svg {
                display: block;
            }

            .task-title {
                flex: 1;
                font-size: 0.875rem;
                line-height: 1.4;
            }
            .task-item.done .task-title {
                text-decoration: line-through;
                color: var(--text-2);
            }

            .task-priority {
                font-size: 0.7rem;
                font-weight: 600;
                padding: 2px 7px;
                border-radius: 99px;
                flex-shrink: 0;
            }
            .priority-low {
                background: var(--success-bg);
                color: var(--success);
            }
            .priority-medium {
                background: var(--accent-bg);
                color: var(--accent);
            }
            .priority-high {
                background: var(--danger-bg);
                color: var(--danger);
            }

            .empty-state {
                text-align: center;
                padding: 2rem 1rem;
                color: var(--text-3);
                font-size: 0.875rem;
            }

            /* ── Debug log ── */
            .log-wrap {
                grid-column: 1 / -1;
            }
            .log-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 0.75rem;
            }
            #mv-log {
                font-family: var(--mono);
                font-size: 0.76rem;
                color: var(--text-2);
                max-height: 150px;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .log-row {
                display: flex;
                gap: 10px;
                align-items: baseline;
                opacity: 0;
                transition: opacity 0.15s;
            }
            .log-row.in {
                opacity: 1;
            }
            .log-ts {
                color: var(--text-3);
                min-width: 62px;
                flex-shrink: 0;
            }
            .log-layer {
                min-width: 50px;
                flex-shrink: 0;
                font-weight: 600;
            }
            .log-layer.model {
                color: var(--success);
            }
            .log-layer.view {
                color: var(--accent);
            }
            .log-msg {
                color: var(--text-2);
            }
            .log-empty {
                color: var(--text-3);
                font-style: italic;
            }
            code {
                font-family: var(--mono);
                font-size: 0.78rem;
                background: var(--surface-2);
                border: 1px solid var(--border);
                border-radius: 4px;
                padding: 1px 5px;
                color: var(--text-2);
            }
        </style>
    </head>
    <body>
        <div class="layout">
            <header class="header">
                <div class="arch-pill">⬡ Model — View</div>
                <h1>Task Manager</h1>
                <p>
                    <code>MV.Model</code> owns state &amp; logic &nbsp;·&nbsp;
                    <code>MV.View</code> owns the binding lifecycle
                    &nbsp;·&nbsp; <code>TaskView</code> renders and handles user
                    input
                </p>
            </header>

            <!-- Main: task list -->
            <div>
                <div class="card">
                    <p class="card-title">Tasks</p>

                    <!-- Add form -->
                    <div class="add-form" style="margin-bottom: 1rem">
                        <input
                            id="inp-title"
                            type="text"
                            placeholder="New task title…"
                        />
                        <div class="row">
                            <select id="inp-priority" style="flex: 1">
                                <option value="low">Low priority</option>
                                <option value="medium" selected>
                                    Medium priority
                                </option>
                                <option value="high">High priority</option>
                            </select>
                            <button class="btn btn-primary" id="btn-add">
                                Add
                            </button>
                        </div>
                    </div>

                    <!-- Filter bar -->
                    <div class="filter-bar">
                        <button class="filter-btn active" data-filter="all">
                            All
                        </button>
                        <button class="filter-btn" data-filter="active">
                            Active
                        </button>
                        <button class="filter-btn" data-filter="done">
                            Done
                        </button>
                        <button class="filter-btn" data-filter="high">
                            High priority
                        </button>
                    </div>

                    <!-- Rendered by TaskView -->
                    <div id="task-list"></div>
                </div>
            </div>

            <!-- Sidebar: stats -->
            <div>
                <div class="card">
                    <p class="card-title">Stats</p>
                    <div class="stats">
                        <div class="stat-row">
                            <span class="stat-label">Total</span>
                            <span class="stat-value accent" id="stat-total"
                                >0</span
                            >
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Done</span>
                            <span class="stat-value success" id="stat-done"
                                >0</span
                            >
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Active</span>
                            <span class="stat-value" id="stat-active">0</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">High priority</span>
                            <span class="stat-value danger" id="stat-high"
                                >0</span
                            >
                        </div>
                        <div class="divider"></div>
                        <div>
                            <div class="stat-row" style="margin-bottom: 0.4rem">
                                <span class="stat-label">Progress</span>
                                <span class="stat-value" id="stat-pct">0%</span>
                            </div>
                            <div class="progress-bar">
                                <div
                                    class="progress-fill"
                                    id="stat-bar"
                                    style="width: 0%"
                                ></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Debug log -->
            <div class="card log-wrap">
                <div class="log-header">
                    <p class="card-title" style="margin: 0">
                        Model / View event log &nbsp;<code>'*'</code>
                    </p>
                    <button
                        class="btn"
                        id="btn-clear-log"
                        style="font-size: 0.75rem; padding: 0.2rem 0.6rem"
                    >
                        Clear
                    </button>
                </div>
                <div id="mv-log">
                    <span class="log-empty">— no events yet —</span>
                </div>
            </div>
        </div>
        <script src="../lattice.js"></script>
        <script src="./task-manager.js"></script>
    </body>
</html>
